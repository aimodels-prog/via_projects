name: via-projects
services:
  db:
    image: postgres:17
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: project_hub
      POSTGRES_USER: project_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_hub -d project_hub"]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    image: postgres:17
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ./database:/migrations:ro
    networks: [backend]
    command: ["psql", "-h", "db", "-U", "project_hub", "-d", "project_hub", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/001-project-hub.sql"]
  app:
    build: .
    image: via-projects:production
    restart: unless-stopped
    mem_limit: 2g
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://project_hub:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/project_hub
      PROJECT_ADMIN_PASSWORD: ${PROJECT_ADMIN_PASSWORD:?Set PROJECT_ADMIN_PASSWORD}
      PROJECT_ACCESS_SECRET: ${PROJECT_ACCESS_SECRET:?Set PROJECT_ACCESS_SECRET}
      PROJECT_AUTH_MODE: ${PROJECT_AUTH_MODE:-password}
      PROJECTS_SSO_KEY: ${PROJECTS_SSO_KEY:-}
      PROJECTS_PORTAL_INTERNAL_URL: ${PROJECTS_PORTAL_INTERNAL_URL:-https://portal.via-int.com}
    volumes:
      - reports:/app/data
    networks:
      backend:
      proxy:
        aliases: [via-projects-app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
networks:
  backend:
    internal: true
  proxy:
    external: true
    name: via_proxy
volumes:
  database:
  reports:
