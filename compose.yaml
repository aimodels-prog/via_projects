services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_hub
      POSTGRES_USER: project_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_hub -d project_hub"]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    image: postgres:17
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./database:/migrations:ro
    command: ["psql", "-h", "db", "-U", "project_hub", "-d", "project_hub", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/001-project-hub.sql"]
  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://project_hub:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/project_hub
      PROJECT_ADMIN_PASSWORD: ${PROJECT_ADMIN_PASSWORD:?Set PROJECT_ADMIN_PASSWORD in .env}
      PROJECT_ACCESS_SECRET: ${PROJECT_ACCESS_SECRET:?Set PROJECT_ACCESS_SECRET in .env}
    ports:
      - "127.0.0.1:8090:3000"
    volumes:
      - reports:/app/data
volumes:
  database:
  reports:
